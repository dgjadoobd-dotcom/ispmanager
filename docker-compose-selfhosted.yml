version: "3.9"

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ispmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ispmanager
      POSTGRES_USER: ispmanager
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_production}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pgvector"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/setup_all.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ispnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ispmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis Cache (Optional but recommended) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ispmanager-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ispnet
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API Server ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: ispmanager-backend
    restart: unless-stopped
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: info

      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ispmanager
      DB_USER: ispmanager
      DB_PASSWORD: ${DB_PASSWORD:-change_me_production}

      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # Security
      JWT_SECRET: ${JWT_SECRET:-change_me_production_jwt_secret}
      SESSION_SECRET: ${SESSION_SECRET:-change_me_production_session_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change_me_production_encryption_key}

      # API Configuration
      API_BASE_URL: https://${DOMAIN:-localhost}
      ALLOWED_ORIGINS: https://${DOMAIN:-localhost},https://www.${DOMAIN:-localhost}

      # RADIUS Configuration
      RADIUS_SECRET: ${RADIUS_SECRET:-radius-secret-key}
      RADIUS_PORT: 1812
      RADIUS_HOST: 0.0.0.0

      # Piprapay Payment Gateway
      PIPRAPAY_API_BASE_URL: ${PIPRAPAY_API_BASE_URL:-https://sandbox.piprapay.com}
      PIPRAPAY_MERCHANT_ID: ${PIPRAPAY_MERCHANT_ID:-your_merchant_id}
      PIPRAPAY_API_KEY: ${PIPRAPAY_API_KEY:-your_api_key}
      PIPRAPAY_API_SECRET: ${PIPRAPAY_API_SECRET:-your_api_secret}
      PIPRAPAY_WEBHOOK_SECRET: ${PIPRAPAY_WEBHOOK_SECRET:-your_webhook_secret}

      # MikroTik Integration
      MIKROTIK_TIMEOUT: 10000
      MIKROTIK_RETRY_ATTEMPTS: 3

      # Email Configuration (Optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ispmanager.local}

    ports:
      - "3001:3001"
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ispnet
    volumes:
      - backend_logs:/home/node/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend (Built application served by Node) ─────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: ispmanager-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - ./dist:/app/dist
    command: npx serve -s dist -l 3000
    depends_on:
      - backend
    networks:
      - ispnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: ispmanager-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ispnet
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional: pgAdmin for Database Management ───────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ispmanager-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ispmanager.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ispnet
    profiles:
      - debug  # Only run with: docker-compose --profile debug up
    volumes:
      - pgadmin_data:/var/lib/pgadmin

networks:
  ispnet:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  pgadmin_data:
    driver: local
