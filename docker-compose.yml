version: "3.9"

services:

  # ── API Proxy (MikroTik + OLT backend) ──────────────────────────────────────
  isp-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: isp-proxy
    restart: unless-stopped
    networks:
      - ispnet
    environment:
      - PORT=3001
    # NOT exposed to host — only accessible via nginx proxy

  # ── Frontend (React + Nginx) ─────────────────────────────────────────────────
  ispmanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ispmanager
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - isp-proxy
    networks:
      - ispnet
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_PUBLISHABLE_KEY=${VITE_SUPABASE_PUBLISHABLE_KEY}

networks:
  ispnet:
    driver: bridge
